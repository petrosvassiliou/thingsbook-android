name: Deploy ChromeOS PWA to Firebase Hosting

on:
  push:
    branches:
      - main
      - 'beta*'
    tags:
      - 'v*'
    paths:
      - 'chromeos-pwa/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-chromeos-pwa.yml'
  workflow_dispatch:

concurrency:
  group: chromeos-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chromeos-pwa/package-lock.json

      - name: Install dependencies, run QA tests, lint & build ChromeOS PWA
        working-directory: chromeos-pwa
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Upload ChromeOS PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thingsbook-chromeos-pwa-dist
          path: chromeos-pwa/dist

      - name: Authenticate to Google Cloud via Keyless Workload Identity Federation (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/116792699915/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc
          service_account: github-action-thingsbook@thingsbook-prod.iam.gserviceaccount.com

      - name: Deploy Stable to Firebase Hosting Live Channel (thingsbook-prod)
        if: >-
          github.ref == 'refs/heads/main' ||
          (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
        run: |
          npx --yes firebase-tools hosting:channel:deploy live --project thingsbook-prod

      - name: Deploy Beta to Isolated Firebase Preview Channel (beta)
        if: >-
          github.ref != 'refs/heads/main' &&
          (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-'))
        run: |
          npx --yes firebase-tools hosting:channel:deploy beta --expires 30d --project thingsbook-prod
