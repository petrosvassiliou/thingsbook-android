name: Build, Test & Release Thingsbook (Android, ChromeOS & macOS)

on:
  push:
    branches:
      - main
      - macOS
      - 'beta*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - macOS
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag (e.g. v1.8.1 or v2.0.0-beta.1) to publish unified Android + ChromeOS + macOS GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: unified-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-android:
    name: JUnit Tests & Signed Release APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Persistent Thingsbook Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.THINGSBOOK_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.gemini"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.gemini/thingsbook-debug.keystore"
            chmod 600 "$HOME/.gemini/thingsbook-debug.keystore"
            echo "Restored persistent Thingsbook signing keystore."
          fi

      - name: Run Android Unit Tests & Assemble Release APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Stage Signed Android APK
        run: |
          mkdir -p dist-android
          cp -f app/build/outputs/apk/release/app-release.apk dist-android/Thingsbook-Full-GTD-Edition.apk

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-Android-APK
          path: dist-android/Thingsbook-Full-GTD-Edition.apk
          if-no-files-found: error
          retention-days: 90

  test-and-build-chromeos:
    name: Unit Tests & Production Build (ChromeOS PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chromeos-pwa/package-lock.json

      - name: Run ChromeOS Unit Tests & Vite Production Build
        working-directory: chromeos-pwa
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload ChromeOS PWA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-ChromeOS-PWA-Dist
          path: chromeos-pwa/dist
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Parity Gate, Swift Tests & Universal DMG (macOS 15)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync & Verify Android <-> macOS Feature, Localization & Version Parity
        run: |
          python3 macos/scripts/sync-strings-from-android.py
          python3 macos/scripts/verify-android-parity.py

      - name: Run ThingsbookCore Swift Unit & Cross-Platform Vector Tests
        working-directory: macos
        run: swift test -v

      - name: Package Universal Thingsbook.app & DMG (arm64 + x86_64)
        run: |
          chmod +x macos/scripts/build-dmg.sh
          ./macos/scripts/build-dmg.sh
          cp -f macos/dist/Thingsbook-macOS-v*-Universal.dmg macos/dist/Thingsbook-macOS-Universal.dmg

      - name: Upload Universal macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-macOS-Universal-DMG
          path: macos/dist/*.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Publish macOS Universal DMG Pre-Release (Compatible with GitHub Immutable Releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="macos-build-${{ github.run_number }}"
          gh release create "$TAG" macos/dist/*.dmg \
            --draft \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Thingsbook for macOS (Universal Build #${{ github.run_number }})" \
            --notes "Universal (Apple Silicon + Intel) macOS DMG built from \`macOS\`. Install or update in one command without Gatekeeper prompts:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/petrosvassiliou/thingsbook-android/main/macos/install.sh | bash
          \`\`\`"
          gh release edit "$TAG" --draft=false --prerelease

  publish-release:
    name: Publish Official or Beta Multi-Platform Release
    runs-on: ubuntu-latest
    needs:
      - test-and-build-android
      - test-and-build-chromeos
      - build-macos
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Verified Platform Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble & Publish GitHub Release (Isolating Pre-Releases from Stable Latest)
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          mkdir -p release-bundle
          cp -f release-artifacts/Thingsbook-Android-APK/Thingsbook-Full-GTD-Edition.apk "release-bundle/Thingsbook-${TAG}-GTD-Full.apk"
          cp -f release-artifacts/Thingsbook-Android-APK/Thingsbook-Full-GTD-Edition.apk "release-bundle/Thingsbook-Full-GTD-Edition.apk"

          (cd release-artifacts/Thingsbook-ChromeOS-PWA-Dist && zip -qr "../../release-bundle/Thingsbook-ChromeOS-PWA-${TAG}.zip" .)

          for dmg in release-artifacts/Thingsbook-macOS-Universal-DMG/*.dmg; do
            cp -f "$dmg" release-bundle/
          done

          VERSION_CODE="$(python3 -c 'import json; print(json.load(open("macos/PARITY_MANIFEST.json"))["syncedAndroidVersionCode"])')"
          NOTES_FILE="releases/RELEASE_NOTES_${TAG}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "Publishing $TAG as an isolated PRE-RELEASE (stable latest remains untouched)..."
            gh release create "$TAG" release-bundle/* \
              --draft \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "Thingsbook ${TAG} Beta (Build ${VERSION_CODE}) — Android, ChromeOS & macOS" \
              "${NOTES_ARGS[@]}"
            gh release edit "$TAG" --draft=false --prerelease
          else
            echo "Publishing $TAG as the official STABLE release..."
            gh release create "$TAG" release-bundle/* \
              --draft \
              --target "${{ github.sha }}" \
              --title "Thingsbook ${TAG} (Build ${VERSION_CODE}) — Android, ChromeOS & macOS" \
              "${NOTES_ARGS[@]}"
            gh release edit "$TAG" --draft=false --latest
          fi
