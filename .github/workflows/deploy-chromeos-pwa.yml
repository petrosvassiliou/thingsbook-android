name: Deploy ChromeOS PWA to Firebase Hosting

on:
  push:
    branches:
      - main
      - 'beta*'
    tags:
      - 'v*'
    paths:
      - 'chromeos-pwa/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-chromeos-pwa.yml'
  workflow_dispatch:

concurrency:
  group: chromeos-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THINGSBOOK_PROD }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chromeos-pwa/package-lock.json

      - name: Install dependencies, run QA tests, lint & build ChromeOS PWA
        working-directory: chromeos-pwa
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Upload ChromeOS PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thingsbook-chromeos-pwa-dist
          path: chromeos-pwa/dist

      - name: Deploy Stable to Firebase Hosting Live Channel (thingsbook-prod)
        if: >-
          env.FIREBASE_SERVICE_ACCOUNT != '' &&
          (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THINGSBOOK_PROD }}
          channelId: live
          projectId: thingsbook-prod

      - name: Deploy Stable via FIREBASE_TOKEN Fallback
        if: >-
          env.FIREBASE_SERVICE_ACCOUNT == '' &&
          env.FIREBASE_TOKEN != '' &&
          (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
        run: |
          npx --yes firebase-tools hosting:channel:deploy live --project thingsbook-prod --token "$FIREBASE_TOKEN"

      - name: Deploy Beta to Isolated Firebase Preview Channel (beta)
        if: >-
          env.FIREBASE_SERVICE_ACCOUNT != '' &&
          github.ref != 'refs/heads/main' &&
          (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-'))
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THINGSBOOK_PROD }}
          channelId: beta
          expires: 30d
          projectId: thingsbook-prod

      - name: Deploy Beta via FIREBASE_TOKEN Fallback
        if: >-
          env.FIREBASE_SERVICE_ACCOUNT == '' &&
          env.FIREBASE_TOKEN != '' &&
          github.ref != 'refs/heads/main' &&
          (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-'))
        run: |
          npx --yes firebase-tools hosting:channel:deploy beta --expires 30d --project thingsbook-prod --token "$FIREBASE_TOKEN"

      - name: Notice When Firebase Hosting Credentials Are Not Configured
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN == ''
        run: |
          echo "::warning::Neither FIREBASE_SERVICE_ACCOUNT_THINGSBOOK_PROD nor FIREBASE_TOKEN is set in GitHub Actions secrets; built ChromeOS PWA artifact uploaded without deploying to Firebase Hosting."
