name: Build, Test & Release Thingsbook (Android, ChromeOS & macOS)

on:
  push:
    branches:
      - main
      - macOS
      - 'beta*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - macOS
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag (e.g. v1.8.1 or v2.0.0-beta.1) to publish unified Android + ChromeOS + macOS GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: unified-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-android:
    name: JUnit Tests & Signed Release APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Persistent Thingsbook Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.THINGSBOOK_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::THINGSBOOK_DEBUG_KEYSTORE_B64 secret is missing; refusing to sign with an ephemeral keystore because that would break in-place upgrades over 1.8 releases."
            exit 1
          fi
          mkdir -p "$HOME/.gemini"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.gemini/thingsbook-debug.keystore"
          chmod 600 "$HOME/.gemini/thingsbook-debug.keystore"
          test -s "$HOME/.gemini/thingsbook-debug.keystore"
          echo "Restored persistent Thingsbook signing keystore."

      - name: Run Android Unit Tests & Assemble Release APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Verify APK Signing Certificate & 1.8 Upgrade Compatibility
        run: |
          python3 - <<'PY'
          import hashlib, struct, sys

          APK_PATH = "app/build/outputs/apk/release/app-release.apk"
          EXPECTED_CERT_SHA256 = "61:75:91:8B:C7:1A:3D:2F:72:E3:AB:14:54:9C:9C:06:66:F3:F3:D1:5E:BB:E1:D8:15:64:78:54:EF:F5:AB:24"

          with open(APK_PATH, "rb") as f:
              data = f.read()

          eocd = data.rfind(b"PK\x05\x06")
          assert eocd != -1, "ZIP EOCD not found in APK"
          cd_offset = struct.unpack_from("<I", data, eocd + 16)[0]
          assert data[cd_offset - 16 : cd_offset] == b"APK Sig Block 42", "APK Signature Block v2 missing"
          block_size = struct.unpack_from("<Q", data, cd_offset - 24)[0]
          block_start = cd_offset - 8 - block_size
          pairs_end = cd_offset - 24
          pos = block_start + 8
          v2_block = None
          while pos < pairs_end:
              pair_len = struct.unpack_from("<Q", data, pos)[0]
              pair_id = struct.unpack_from("<I", data, pos + 8)[0]
              if pair_id == 0x7109871A:
                  v2_block = data[pos + 12 : pos + 8 + pair_len]
                  break
              pos += 8 + pair_len
          assert v2_block is not None, "APK Signature Scheme v2 ID (0x7109871a) missing"

          signers_len = struct.unpack_from("<I", v2_block, 0)[0]
          assert signers_len > 0, "Empty v2 signers list"
          signer_len = struct.unpack_from("<I", v2_block, 4)[0]
          signed_data_len = struct.unpack_from("<I", v2_block, 8)[0]
          signed_data = v2_block[12 : 12 + signed_data_len]
          digests_len = struct.unpack_from("<I", signed_data, 0)[0]
          certs_offset = 4 + digests_len
          certs_len = struct.unpack_from("<I", signed_data, certs_offset)[0]
          assert certs_len > 0, "No X.509 certificate in v2 signature"
          cert_len = struct.unpack_from("<I", signed_data, certs_offset + 4)[0]
          cert_der = signed_data[certs_offset + 8 : certs_offset + 8 + cert_len]
          actual_fp = ":".join(f"{b:02X}" for b in hashlib.sha256(cert_der).digest())
          print(f"Verified APK v2 certificate SHA-256: {actual_fp}")
          if actual_fp != EXPECTED_CERT_SHA256:
              sys.exit(f"Signing certificate mismatch! Expected {EXPECTED_CERT_SHA256} (1.8 release key), got {actual_fp}")

          import re
          gradle_text = open("app/build.gradle.kts", "r", encoding="utf-8").read()
          vc_match = re.search(r"versionCode\s*=\s*(\d+)", gradle_text)
          assert vc_match is not None, "versionCode missing in app/build.gradle.kts"
          vc = int(vc_match.group(1))
          print(f"Verified APK versionCode: {vc} (> 44 required for 1.8.1 upgrade)")
          if vc <= 44:
              sys.exit(f"versionCode {vc} must be > 44 (v1.8.1) for in-place Android upgrades")
          PY

      - name: Stage Signed Android APK
        run: |
          mkdir -p dist-android
          cp -f app/build/outputs/apk/release/app-release.apk dist-android/Thingsbook-Full-GTD-Edition.apk

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-Android-APK
          path: dist-android/Thingsbook-Full-GTD-Edition.apk
          if-no-files-found: error
          retention-days: 90

  test-and-build-chromeos:
    name: Unit Tests & Production Build (ChromeOS PWA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chromeos-pwa/package-lock.json

      - name: Run ChromeOS Unit Tests & Vite Production Build
        working-directory: chromeos-pwa
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload ChromeOS PWA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-ChromeOS-PWA-Dist
          path: chromeos-pwa/dist
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Parity Gate, Swift Tests & Universal DMG (macOS 26 Intel)
    runs-on: macos-26-intel
    continue-on-error: true
    outputs:
      built: ${{ steps.mark_built.outputs.built }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync & Verify Android <-> macOS Feature, Localization & Version Parity
        run: |
          python3 macos/scripts/sync-strings-from-android.py
          python3 macos/scripts/verify-android-parity.py

      - name: Run ThingsbookCore Swift Unit & Cross-Platform Vector Tests
        working-directory: macos
        run: swift test -v

      - name: Package Universal Thingsbook.app & DMG (arm64 + x86_64)
        run: |
          chmod +x macos/scripts/build-dmg.sh
          ./macos/scripts/build-dmg.sh
          cp -f macos/dist/Thingsbook-macOS-v*-Universal.dmg macos/dist/Thingsbook-macOS-Universal.dmg

      - name: Upload Universal macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-macOS-Universal-DMG
          path: macos/dist/*.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Mark macOS Build Succeeded
        id: mark_built
        run: echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Publish macOS Universal DMG Pre-Release (Compatible with GitHub Immutable Releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="macos-build-${{ github.run_number }}"
          gh release create "$TAG" macos/dist/*.dmg \
            --draft \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Thingsbook for macOS (Universal Build #${{ github.run_number }})" \
            --notes "Universal (Apple Silicon + Intel) macOS DMG built from \`macOS\`. Install or update in one command without Gatekeeper prompts:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/petrosvassiliou/thingsbook-android/main/macos/install.sh | bash
          \`\`\`"
          gh release edit "$TAG" --draft=false --prerelease

  build-macos-fallback:
    name: Parity Gate, Swift Tests & Universal DMG (macOS Latest Fallback)
    runs-on: macos-latest
    needs:
      - build-macos
    if: always() && needs.build-macos.outputs.built != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync & Verify Android <-> macOS Feature, Localization & Version Parity
        run: |
          python3 macos/scripts/sync-strings-from-android.py
          python3 macos/scripts/verify-android-parity.py

      - name: Run ThingsbookCore Swift Unit & Cross-Platform Vector Tests
        working-directory: macos
        run: swift test -v

      - name: Package Universal Thingsbook.app & DMG (arm64 + x86_64)
        run: |
          chmod +x macos/scripts/build-dmg.sh
          ./macos/scripts/build-dmg.sh
          cp -f macos/dist/Thingsbook-macOS-v*-Universal.dmg macos/dist/Thingsbook-macOS-Universal.dmg

      - name: Upload Universal macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thingsbook-macOS-Universal-DMG
          path: macos/dist/*.dmg
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish Official or Beta Multi-Platform Release
    runs-on: ubuntu-latest
    needs:
      - test-and-build-android
      - test-and-build-chromeos
      - build-macos
      - build-macos-fallback
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') &&
      needs.test-and-build-android.result == 'success' &&
      needs.test-and-build-chromeos.result == 'success' &&
      (needs.build-macos.outputs.built == 'true' || needs.build-macos-fallback.result == 'success')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Verified Platform Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble & Publish GitHub Release (Isolating Pre-Releases from Stable Latest)
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          mkdir -p release-bundle
          cp -f release-artifacts/Thingsbook-Android-APK/Thingsbook-Full-GTD-Edition.apk "release-bundle/Thingsbook-${TAG}-GTD-Full.apk"
          cp -f release-artifacts/Thingsbook-Android-APK/Thingsbook-Full-GTD-Edition.apk "release-bundle/Thingsbook-Full-GTD-Edition.apk"

          (cd release-artifacts/Thingsbook-ChromeOS-PWA-Dist && zip -qr "../../release-bundle/Thingsbook-ChromeOS-PWA-${TAG}.zip" .)

          for dmg in release-artifacts/Thingsbook-macOS-Universal-DMG/*.dmg; do
            cp -f "$dmg" release-bundle/
          done

          VERSION_CODE="$(python3 -c 'import json; print(json.load(open("macos/PARITY_MANIFEST.json"))["syncedAndroidVersionCode"])')"
          NOTES_FILE="releases/RELEASE_NOTES_${TAG}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "Publishing $TAG as an isolated PRE-RELEASE (stable latest remains untouched)..."
            TITLE="Thingsbook ${TAG} Beta (Build ${VERSION_CODE}) — Android, ChromeOS & macOS"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release-bundle/* --clobber
              if [ -f "$NOTES_FILE" ]; then
                gh release edit "$TAG" --draft=false --prerelease --latest=false --title "$TITLE" --notes-file "$NOTES_FILE"
              else
                gh release edit "$TAG" --draft=false --prerelease --latest=false --title "$TITLE"
              fi
            else
              gh release create "$TAG" release-bundle/* \
                --draft \
                --prerelease \
                --target "${{ github.sha }}" \
                --title "$TITLE" \
                "${NOTES_ARGS[@]}"
              gh release edit "$TAG" --draft=false --prerelease --latest=false
            fi
          else
            echo "Publishing $TAG as the official STABLE release..."
            TITLE="Thingsbook ${TAG} (Build ${VERSION_CODE}) — Android, ChromeOS & macOS"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release-bundle/* --clobber
              if [ -f "$NOTES_FILE" ]; then
                gh release edit "$TAG" --draft=false --latest --title "$TITLE" --notes-file "$NOTES_FILE"
              else
                gh release edit "$TAG" --draft=false --latest --title "$TITLE"
              fi
            else
              gh release create "$TAG" release-bundle/* \
                --draft \
                --target "${{ github.sha }}" \
                --title "$TITLE" \
                "${NOTES_ARGS[@]}"
              gh release edit "$TAG" --draft=false --latest
            fi
          fi
